<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitação de Diárias</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:white;
    width:420px;
    padding:40px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.10);
}

h1{
    color:#00A651;
    text-align:center;
    margin-bottom:10px;
}

.subtitulo{
    text-align:center;
    color:#666;
    font-size:14px;
    margin-bottom:30px;
}

label{
    font-weight:bold;
    color:#444;
    display:block;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #dcdcdc;
    border-radius:8px;
    margin-bottom:20px;
    font-size:15px;
}

button{
    width:100%;
    padding:14px;
    background:#F28C00;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

#mensagem{
    margin-top:15px;
    text-align:center;
}

</style>
</head>

<body>

<div class="card">

    <h1>Solicitação de Diárias</h1>

    <div class="subtitulo">
        Informe sua matrícula para acessar o sistema
    </div>

    <label>Matrícula</label>

    <input
        id="matricula"
        type="text"
        placeholder="Digite sua matrícula"
    >

    <button id="btnEntrar">
        Entrar
    </button>

    <div id="mensagem"></div>

</div>

</body>
</html>
