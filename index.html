<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitação de Diárias</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.card{
    background:white;
    padding:35px;
    border-radius:12px;
    box-shadow:0 0 20px rgba(0,0,0,.10);
    width:380px;
}

h1{
    color:#00A651;
    text-align:center;
    margin-bottom:25px;
}

p{
    color:#444;
    font-size:14px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#F28C00;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
    font-size:15px;
    transition:0.3s;
}

button:hover{
    background:#D97706;
}

</style>
</head>

<body>

<div class="card">

    <h1>Solicitação de Diárias</h1>

    <p>Digite sua matrícula:</p>

    <input
        type="text"
        placeholder="Informe sua matrícula"
    >

    <button>
        Entrar
    </button>

</div>

</body>
</html>
