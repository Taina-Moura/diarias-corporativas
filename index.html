<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitação de Diárias</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .card{
            background:white;
            width:420px;
            padding:40px;
            border-radius:16px;
            box-shadow:0 10px 30px rgba(0,0,0,0.10);
        }

        h1{
            color:#00A651;
            text-align:center;
            margin-bottom:10px;
        }

        .subtitulo{
            text-align:center;
            color:#666;
            margin-bottom:30px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#333;
        }

        input{
            width:100%;
            padding:14px;
            border:1px solid #dcdcdc;
            border-radius:8px;
            margin-bottom:20px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:8px;
            background:#F28C00;
            color:white;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
        }

        button:hover{
            background:#d97d00;
        }

        #mensagem{
            margin-top:20px;
            text-align:center;
            font-weight:bold;
        }

    </style>
</head>

<body>

    <div class="card">

        <h1>Solicitação de Diárias</h1>

        <div class="subtitulo">
            Informe sua matrícula CLB para acessar o sistema
        </div>

        <label>Matrícula</label>

        <input
            id="matricula"
            type="text"
            placeholder="Digite sua matrícula">

        <button id="btnEntrar">
            Entrar
        </button>

        <div id="mensagem"></div>

    </div>

    <script>

        document.getElementById("btnEntrar").addEventListener("click", function(){

            const matricula =
                document.getElementById("matricula").value.trim();

            const mensagem =
                document.getElementById("mensagem");

            if(matricula === ""){

                mensagem.style.color = "red";
                mensagem.innerHTML =
                    "Informe uma matrícula.";

                return;
            }

            mensagem.style.color = "#00A651";

            mensagem.innerHTML =
                "Matrícula digitada: " + matricula;

        });

    </script>

</body>

</html>
